<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cumulus Demo</title>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body class="min-h-screen bg-amber-50 px-6 py-12 text-blue-950 antialiased">
    <main class="mx-auto max-w-5xl">
      <header class="mb-8 border-b border-slate-700 pb-5">
        <p class="text-sm font-medium uppercase tracking-widest text-cyan-300">
          Canvas element
        </p>
        <h1 class="mt-2 text-4xl font-semibold">Cumulus Demo</h1>
      </header>
      <section class="overflow-auto rounded-lg bg-white p-4 shadow-xl">
        <cumulus-canvas
          id="c1"
          width="600"
          height="400"
          growIn
          regenerateOnClick
        ></cumulus-canvas>
        <p class="mt-2 text-sm text-slate-500">Click the cloud to make a new one.</p>
      </section>
    </main>
    <script type="module">
      import "../src/define.js";
      // demo-specific interaction code here, or in demo.js
    </script>
  </body>
</html>
